services:
  server_node:
    build:
      context: ./server_node
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production

  server_python:
    build:
      context: ./server_python
    ports:
      - "5001:5000"

  front:
    build:
      context: ./front
    ports:
      - "5173:5173"
    depends_on:
      - server_node
      - server_python
